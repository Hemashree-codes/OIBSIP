
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">✓</div>
            <p class="eyebrow">YOUR PERSONAL PLANNER</p>
            <h1>TaskFlow</h1>
            <p class="subtitle">Small steps. Big achievements.</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span id="totalTasks">0</span>
                <p>Total Tasks</p>
            </div>
            <div class="stat-card">
                <span id="completedTasks">0</span>
                <p>Completed</p>
            </div>
            <div class="stat-card">
                <span id="pendingTasks">0</span>
                <p>Remaining</p>
            </div>
        </section>

        <section class="task-panel">
            <h2>My Tasks</h2>
            <p class="panel-subtitle">Organize your day, one task at a time.</p>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    maxlength="150"
                    autocomplete="off"
                    required
                >
                <select id="priority" aria-label="Task priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
                <button type="submit" class="add-btn">+ Add</button>
            </form>

            <div class="toolbar">
                <div class="filters" aria-label="Filter tasks">
                    <button class="filter active" data-filter="all" type="button">All</button>
                    <button class="filter" data-filter="pending" type="button">Pending</button>
                    <button class="filter" data-filter="completed" type="button">Completed</button>
                </div>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                >
            </div>

            <ul id="taskList" class="task-list"></ul>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✦</div>
                <h3>No tasks yet</h3>
                <p>Add your first task to get started!</p>
            </div>

            <footer class="panel-footer">
                <span id="taskSummary">0 tasks</span>
                <button id="clearCompleted" class="text-btn" type="button">
                    Clear completed
                </button>
            </footer>
        </section>

        <p class="footer-note">Made with care · Stay focused and keep growing.</p>
    </main>
</body>
</html>
